<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chain — Card Roguelite</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #14161c;
    color: #e8eaf0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }

  #app { width: 100%; max-width: 720px; }

  /* ── 언어 전환 ─────────────────────────── */
  .lang-bar { display: flex; justify-content: flex-end; gap: 5px; margin-bottom: 12px; }
  .lang-btn {
    background: transparent;
    color: #565c6e;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
  }
  .lang-btn.active { background: #1e2129; color: #b6bcca; }

  /* ── 상단 정보 ─────────────────────────── */
  .hud {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .hud-cell {
    background: #1e2129;
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
  }
  /* 좁은 화면에서 줄바꿈되면 라벨이 깨져 보인다 */
  .hud-label { font-size: 11px; color: #8b91a3; margin-bottom: 4px; white-space: nowrap; }
  @media (max-width: 420px) {
    .hud { gap: 6px; }
    .hud-cell { padding: 10px 4px; }
    .hud-label { font-size: 10px; }
    .hud-value { font-size: 17px; }
  }
  .hud-value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hud-value.target { color: #ff8a5b; }
  .hud-value.score  { color: #5bc8ff; }

  /* 진행 바 */
  .progress {
    height: 6px;
    background: #1e2129;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #5bc8ff, #7b5bff);
    transition: width .4s ease;
  }

  /* ── 점수 계산 표시 ────────────────────── */
  .stage-area {
    background: #1a1d24;
    border-radius: 14px;
    padding: 24px 16px;
    margin-bottom: 24px;
    text-align: center;
    min-height: 148px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
  }
  .hand-name { font-size: 15px; color: #8b91a3; letter-spacing: .02em; }
  .hand-name.active { color: #e8eaf0; }

  /* 연쇄 상태 안내 */
  .chain { font-size: 13px; color: #565c6e; min-height: 16px; }
  .chain.keep  { color: #7bff9b; }
  .chain.break { color: #ff5b7b; }

  .formula {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 30px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  /* 숫자마다 이름을 붙여둔다. 뭘 곱하는 중인지 설명 없이 알 수 있게 */
  .term { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .term-label {
    font-size: 10px;
    font-weight: 600;
    color: #565c6e;
    letter-spacing: .08em;
  }
  .chips { color: #5bc8ff; }
  .times { color: #565c6e; font-size: 20px; margin-bottom: 13px; }
  .mult  { color: #ff5b7b; }
  .combo { color: #7bff9b; transition: color .2s ease; }
  /* 연쇄가 1일 때는 꺼져 있다가, 쌓이는 순간 켜진다 */
  .combo.idle { color: #444a5a; }
  .combo.bump { animation: pop .35s ease; }

  .result {
    font-size: 34px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #ffd75b;
    min-height: 41px;
  }
  .result.pop { animation: pop .35s ease; }
  /* 아직 안 낸 상태의 예상치는 확정 점수보다 흐리게 */
  .result.preview { color: #a8913f; font-size: 27px; }

  /* 이 핸드를 내면 도달할 점수 / 목표 */
  .projection {
    font-size: 13px;
    color: #8b91a3;
    font-variant-numeric: tabular-nums;
    min-height: 18px;
  }
  .projection.clear { color: #7bff9b; font-weight: 700; }
  @keyframes pop {
    0%   { transform: scale(.7); opacity: 0; }
    60%  { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ── 정렬 버튼 ─────────────────────────── */
  .sort-bar { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
  .sort-btn {
    background: #1e2129;
    color: #6b7183;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 15px;
    border-radius: 999px;
  }
  .sort-btn.active { background: #2f3542; color: #e8eaf0; }

  /* ── 손패 ──────────────────────────────── */
  .hand {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    min-height: 116px;
  }
  .card {
    width: 68px;
    height: 96px;
    background: #f4f5f8;
    border-radius: 8px;
    color: #14161c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    user-select: none;
    transition: transform .15s ease, box-shadow .15s ease;
    border: 2px solid transparent;
  }
  .card:hover { transform: translateY(-6px); }
  .card.selected {
    transform: translateY(-16px);
    border-color: #ffd75b;
    box-shadow: 0 6px 20px rgba(255,215,91,.25);
  }
  .card.red { color: #d8354a; }
  .card-rank { font-size: 24px; font-weight: 800; line-height: 1; }
  .card-suit { font-size: 20px; line-height: 1; }

  /* itch.io 임베드처럼 좁은 폭에서도 카드 8장이 한 줄에 들어가게.
     (반드시 .card 기본 규칙보다 뒤에 와야 한다 — 미디어 쿼리는 우선순위를 안 올린다) */
  @media (max-width: 719px) {
    .card { width: 60px; height: 85px; }
    .card-rank { font-size: 21px; }
    .card-suit { font-size: 17px; }
    .hand { gap: 6px; }
  }

  /* ── 버튼 ──────────────────────────────── */
  .actions { display: flex; gap: 10px; justify-content: center; }
  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 13px 26px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: #fff;
    transition: opacity .15s ease;
  }
  button:disabled { opacity: .3; cursor: default; }
  button:not(:disabled):hover { opacity: .85; }
  .btn-play    { background: #2f6bff; }
  .btn-discard { background: #3a3f4d; }

  /* ── 족보표 ────────────────────────────── */
  .guide {
    margin-top: 26px;
    background: #1a1d24;
    border-radius: 12px;
    overflow: hidden;
  }
  .guide summary {
    padding: 12px 16px;
    cursor: pointer;
    font-size: 13px;
    color: #8b91a3;
    user-select: none;
  }
  .guide summary::marker { color: #565c6e; }
  .guide-count { color: #7bff9b; }
  .guide-list { padding: 0 8px 10px; display: flex; flex-direction: column; gap: 2px; }
  .guide-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 7px;
    font-size: 13px;
    color: #626879;
  }
  /* 지금 손패로 만들 수 있는 족보를 켜준다 */
  .guide-row.can { background: #232833; color: #e8eaf0; }
  .guide-name { font-weight: 700; }
  .guide-desc { font-weight: 400; font-size: 12px; color: #565c6e; margin-left: 8px; }
  .guide-row.can .guide-desc { color: #8b91a3; }
  .guide-score { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; }
  /* 업그레이드로 올라간 수치는 눈에 띄게 */
  .guide-score.buffed { color: #ffd75b; font-weight: 700; }

  /* ── 업그레이드 선택 ───────────────────── */
  .upgrades {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 580px;
  }
  .upgrade {
    flex: 1 1 165px;
    min-width: 155px;
    background: #1e2129;
    border: 1px solid #2f3542;
    border-radius: 12px;
    padding: 16px 15px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    text-align: left;
    font-weight: 400;
    color: #e8eaf0;
  }
  .upgrade:hover { background: #262b36; border-color: #4a5266; opacity: 1; }
  .upgrade-name { font-size: 15px; font-weight: 700; color: #ffd75b; }
  .upgrade-desc { font-size: 12px; color: #8b91a3; line-height: 1.5; }

  /* ── 오버레이 (스테이지 클리어 / 게임오버) ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,11,15,.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 24px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 30px; }
  .overlay p { color: #8b91a3; font-size: 15px; line-height: 1.6; }

  /* 복사될 내용을 그대로 보여준다. 뭐가 붙여넣어질지 알아야 누른다 */
  .share-preview {
    font-family: inherit;
    font-size: 13px;
    line-height: 1.8;
    color: #b6bcca;
    background: #1a1d24;
    border-radius: 10px;
    padding: 14px 20px;
    white-space: pre;
    text-align: left;
    margin: 0;
  }
  .ov-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .overlay .big {
    font-size: 44px;
    font-weight: 800;
    color: #ffd75b;
    font-variant-numeric: tabular-nums;
  }

  /* .overlay 규칙보다 뒤에 와야 오버레이에도 제대로 먹는다 */
  .hidden { display: none; }
</style>
</head>
<body>

<div id="app">
  <div class="lang-bar">
    <button class="lang-btn" id="sound-btn">🔊</button>
    <button class="lang-btn" id="lang-en">EN</button>
    <button class="lang-btn" id="lang-ko">한국어</button>
  </div>

  <div class="hud">
    <div class="hud-cell">
      <div class="hud-label" data-i18n="hud_stage">Stage</div>
      <div class="hud-value" id="hud-stage">1</div>
    </div>
    <div class="hud-cell">
      <div class="hud-label" data-i18n="hud_target">Target</div>
      <div class="hud-value target" id="hud-target">300</div>
    </div>
    <div class="hud-cell">
      <div class="hud-label" data-i18n="hud_score">Score</div>
      <div class="hud-value score" id="hud-score">0</div>
    </div>
    <div class="hud-cell">
      <div class="hud-label" data-i18n="hud_left">Hands / Discards</div>
      <div class="hud-value" id="hud-left">4 / 3</div>
    </div>
  </div>

  <div class="progress"><div class="progress-fill" id="progress"></div></div>

  <div class="stage-area">
    <div class="hand-name" id="hand-name" data-i18n="pick_cards">Pick your cards (up to 5)</div>
    <div class="chain" id="chain"></div>
    <div class="formula">
      <div class="term"><span class="chips" id="chips">0</span><span class="term-label" data-i18n="lbl_chips">CHIPS</span></div>
      <span class="times">×</span>
      <div class="term"><span class="mult" id="mult">0</span><span class="term-label" data-i18n="lbl_mult">MULT</span></div>
      <span class="times">×</span>
      <div class="term"><span class="combo idle" id="combo">1</span><span class="term-label" data-i18n="lbl_chain">CHAIN</span></div>
    </div>
    <div class="result" id="result"></div>
    <div class="projection" id="projection"></div>
  </div>

  <div class="sort-bar">
    <button class="sort-btn" id="sort-rank" data-i18n="sort_rank">By rank</button>
    <button class="sort-btn" id="sort-suit" data-i18n="sort_suit">By suit</button>
  </div>

  <div class="hand" id="hand"></div>

  <div class="actions">
    <button class="btn-play" id="btn-play" data-i18n="btn_play" disabled>Play</button>
    <button class="btn-discard" id="btn-discard" data-i18n="btn_discard" disabled>Discard</button>
  </div>

  <details class="guide" id="guide" open>
    <summary id="guide-summary">Hand guide</summary>
    <div class="guide-list" id="guide-list"></div>
  </details>
</div>

<div class="overlay hidden" id="overlay">
  <h2 id="ov-title"></h2>
  <div class="big" id="ov-score"></div>
  <p id="ov-desc"></p>
  <pre class="share-preview hidden" id="ov-share"></pre>
  <div class="upgrades hidden" id="ov-upgrades"></div>
  <div class="ov-actions">
    <button class="btn-play" id="ov-btn"></button>
    <button class="btn-discard hidden" id="ov-share-btn" data-i18n="copy_result">Copy Result</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
//  설정값 — 밸런싱은 전부 여기서 만진다
// ══════════════════════════════════════════════

// ── 분석 ───────────────────────────────────────
// 이벤트를 GoatCounter로 보낸다. 스크립트가 없으면 조용히 무시된다.
// (개인정보는 아무것도 안 보낸다. 아래 이름들만 나간다.)
// 로컬에서 여는 경우(file://, localhost)는 집계하지 않는다.
// 내 테스트 플레이가 섞이면 지표가 통째로 못 쓰게 된다.
const ANALYTICS_ON = location.protocol.startsWith('http')
                  && !['localhost', '127.0.0.1'].includes(location.hostname);

function track(name) {
  if (!ANALYTICS_ON) return;
  const send = () => {
    if (window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({ path: name, event: true });
    }
  };
  // 분석 스크립트가 async라 게임보다 늦게 뜰 수 있어 한 번 더 시도한다
  if (window.goatcounter && window.goatcounter.count) send();
  else setTimeout(send, 2000);
}

// 플레이 시간을 구간으로 묶는다 (초 단위 원본은 보내지 않는다)
function playtimeBucket(sec) {
  if (sec <  120) return 'playtime-0-2m';
  if (sec <  300) return 'playtime-2-5m';
  if (sec <  600) return 'playtime-5-10m';
  if (sec < 1200) return 'playtime-10-20m';
  return 'playtime-20m+';
}


// ── 소리 ───────────────────────────────────────
// 파일 없이 Web Audio로 합성한다. 에셋이 0개라 HTML 한 장 구조가 유지된다.
let audioCtx = null;
let SOUND_ON = localStorage.getItem('sound') !== 'off';

function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// 음 하나. slideTo를 주면 그 주파수까지 미끄러진다.
function tone(freq, { dur = .12, type = 'triangle', gain = .12, delay = 0, slideTo = null } = {}) {
  if (!SOUND_ON) return;
  try {
    const ctx = ac();
    const t0  = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g   = ctx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);

    // 딱딱 끊기지 않게 짧게 올렸다 지수적으로 내린다
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + .008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    osc.connect(g).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + .02);
  } catch (e) { /* 오디오가 막힌 환경에서도 게임은 굴러가야 한다 */ }
}

// 5음 음계. 어떤 조합으로 울려도 불협이 안 생긴다.
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
const C4 = 261.63;
const step = s => C4 * Math.pow(2, s / 12);

const sfx = {
  select:   () => tone(880, { dur: .05, type: 'square', gain: .05 }),
  deselect: () => tone(620, { dur: .05, type: 'square', gain: .04 }),
  discard:  () => tone(300, { dur: .18, type: 'sawtooth', gain: .05, slideTo: 120 }),

  // 연쇄가 높을수록 음이 계단으로 더 높이 올라간다.
  // 숫자를 안 봐도 지금 잘 쌓이고 있다는 걸 귀로 알게 된다.
  score: combo => {
    const n = Math.max(1, Math.min(combo, PENTA.length));
    for (let i = 0; i < n; i++) {
      tone(step(PENTA[i]), { dur: .16, gain: .11, delay: i * .055 });
    }
  },

  chainBreak: () => tone(330, { dur: .32, type: 'sawtooth', gain: .09, slideTo: 90 }),
  clear:      () => [0, 4, 7, 12].forEach((s, i) => tone(step(s), { dur: .5,  gain: .09, delay: i * .07 })),
  over:       () => [12, 7, 3, 0].forEach((s, i) => tone(step(s), { dur: .45, gain: .08, delay: i * .12 })),
  upgrade:    () => [0, 7, 12].forEach((s, i)     => tone(step(s + 7), { dur: .25, gain: .07, delay: i * .05 })),
};

// 브라우저는 사용자가 한 번 누르기 전까지 소리를 막는다. 첫 클릭에 풀어준다.
document.addEventListener('pointerdown', () => { if (SOUND_ON) ac(); }, { once: true });


// ── 언어 ───────────────────────────────────────
// 기본은 영어. 고른 언어는 기억한다.
// 값이 함수인 항목은 숫자 등을 끼워 넣는 문장이다.
const I18N = {
  en: {
    title:      'Chain — Card Roguelite',
    hud_stage:  'Stage',
    hud_target: 'Target',
    hud_score:  'Score',
    hud_left:   'Hands / Discards',

    pick_cards:  'Pick your cards (up to 5)',
    chain_intro: 'Beat your last hand in chips to build a chain',
    chain_first: "This hand's chips become the bar to beat",
    chain_carry: combo => `Chain ×${combo} carried over — a new stage starts fresh, any hand keeps it`,
    chain_last:  (name, chips, combo) => `Last: ${name} ${chips} chips · Chain ×${combo} — next must beat ${chips}`,
    chain_hold:  (a, b, next) => `${a} > ${b} chips · Chain holds → ×${next}`,
    chain_max:   cap => `Chain maxed ×${cap}`,
    chain_break: (a, b, combo) => `${a} ≤ ${b} chips · Chain breaks (×${combo} → ×1)`,
    chain_none:  (a, b) => `${a} ≤ ${b} chips · No chain`,

    lbl_chips: 'CHIPS',
    lbl_mult:  'MULT',
    lbl_chain: 'CHAIN',
    clear_mark: '  ·  CLEAR!',

    btn_play:    'Play',
    btn_discard: 'Discard',
    sort_rank:   'By rank',
    sort_suit:   'By suit',

    guide:        'Hand guide',
    guide_count:  n => `Hand guide · <span class="guide-count">${n} available now</span>`,

    stage_clear: n => `Stage ${n} Clear`,
    pick_one:    target => `Next target ${target} · pick one`,
    game_over:   'Game Over',
    new_best:    prev => `New best! (was ${prev})`,
    ended_at:    (n, best) => `Ended at stage ${n} · best ${best}`,
    play_again:  'Play Again',
    copy_result: 'Copy Result',
    copied:      'Copied!',
    copy_manual: 'Copy the text above',

    share_title: '🃏 Chain — Card Roguelite',
    share_line1: (n, score) => `Ended at stage ${n} · ${score} pts`,
    share_line2: c => `Best chain ×${c}`,
  },

  ko: {
    title:      '연쇄 — 카드 로그라이트',
    hud_stage:  '스테이지',
    hud_target: '목표',
    hud_score:  '현재 점수',

// 스테이지를 깰 때마다 3개 중 1개를 고른다.
// 위 상수들은 "시작값"일 뿐이고 실제 값은 state가 들고 있다.
function addBonus(s, type, chips, mult) {
  const b = s.bonus[type] || (s.bonus[type] = { chips: 0, mult: 0 });
  b.chips += chips;
  b.mult  += mult;
}

// 모든 족보에 한꺼번에. HAND_TYPES가 아래에 정의되므로 호출 시점에 읽는다.
function addBonusAll(s, chips, mult) {
  Object.keys(HAND_TYPES).forEach(k => addBonus(s, k, chips, mult));
}

let state;

function newGame() {
  state = {
    stage: 1,
    totalScore: 0,   // 지금까지 누적 (= 최종 기록)
    deck: [],
    hand: [],
    selected: new Set(),
    stageScore: 0,
    handsLeft: HANDS_PER_STAGE,
    discardsLeft: DISCARDS_PER_STAGE,
    locked: false,      // 점수 연출 중에는 입력을 막는다
    lastChips: 0,       // 직전 핸드의 칩. 이걸 넘겨야 연쇄가 이어진다
    lastName: null,     // 직전에 낸 족보 이름 (표시용)
    combo: 0,           // 연쇄 단계 (스테이지를 넘어가도 유지)
    maxCombo: 0,        // 이 판에서 도달한 최고 연쇄 (분석용)
    startedAt: Date.now(),
    sortMode: localStorage.getItem('sortMode') || 'rank',   // 정렬 취향은 기억한다

    // ── 업그레이드로 바뀌는 값들 ──
    // 위 상수는 시작값일 뿐. 실제로 참조하는 건 전부 이쪽이다.
    handsMax:     HANDS_PER_STAGE,
    discardsMax:  DISCARDS_PER_STAGE,
    handSize:     HAND_SIZE,
    comboCap:     COMBO_CAP,
    bonus:        {},          // 족보별 { chips, mult } 추가치
    removedRanks: new Set(),   // 덱에서 빼버린 숫자
    addedRanks:   [],          // 덱에 더 넣은 숫자
    taken:        {},          // 업그레이드 id별 획득 횟수

    // 연쇄 규칙 자체를 바꾸는 값들
    comboFloor:  1,            // 끊겼을 때 떨어지는 바닥
    chainSoft:   false,        // 끊겨도 절반까지만 떨어진다
    chainEqual:  false,        // 칩이 같아도 연쇄가 이어진다
    surgeAt:     0,            // 이 연쇄 이상이면 배수 2배 (0이면 없음)
    zeroOnBreak: false,        // 끊긴 핸드는 점수가 0
    bankPerHand: 0,            // 클리어 시 남은 핸드 1개당 보너스
  };
  track('run-start');
  startStage();
}

function startStage() {
  state.deck = shuffle(makeDeck());
  state.hand = [];
  state.selected.clear();
  state.stageScore = 0;
  state.handsLeft = state.handsMax;
  state.discardsLeft = state.discardsMax;

  // 칩 기준은 스테이지마다 초기화한다. 연쇄 자체는 유지된다.
  // 안 그러면 스테이지를 깨려고 지른 큰 패가 다음 스테이지 기준이 되어
  // 첫 핸드에서 절반은 그냥 끊긴다 (측정: 넘길 확률 51%).
  state.lastChips = 0;
  state.lastName  = null;

  drawUp();
  render();
}

function makeDeck() {
  const deck = [];
  for (let suit = 0; suit < 4; suit++) {
    for (let rank = 1; rank <= 13; rank++) {
      if (state.removedRanks.has(rank)) continue;   // 업그레이드로 빼버린 숫자
      deck.push({ rank, suit });
    }
  }
  // 업그레이드로 더 넣은 카드
  for (const rank of state.addedRanks) {
    for (let suit = 0; suit < 4; suit++) deck.push({ rank, suit });
  }
  return deck;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 손패를 HAND_SIZE까지 채운다. 뽑고 나면 항상 다시 정렬한다.
function drawUp() {
  while (state.hand.length < state.handSize && state.deck.length > 0) {
    state.hand.push(state.deck.pop());
  }
  // 덱이 마르고 손패까지 비면 낼 카드가 없어 진행이 막힌다.
  // 덱을 새로 만들어 보충한다.
  if (state.hand.length === 0) {
    state.deck = shuffle(makeDeck());
    while (state.hand.length < state.handSize && state.deck.length > 0) {
      state.hand.push(state.deck.pop());
    }
  }
  sortHand();
}

// 정렬 기준값. A는 rank가 1이지만 가장 높은 카드로 다룬다.
const sortValue = c => (c.rank === 1 ? 14 : c.rank);

function sortHand() {
  // 인덱스로 들고 있는 선택 상태가 깨지지 않게 카드 자체를 기억해뒀다 복원한다
  const picked = [...state.selected].map(i => state.hand[i]);

  state.hand.sort(state.sortMode === 'suit'
    ? (a, b) => a.suit - b.suit || sortValue(b) - sortValue(a)
    : (a, b) => sortValue(b) - sortValue(a) || a.suit - b.suit);

  state.selected = new Set(picked.map(c => state.hand.indexOf(c)));
}

function setSort(mode) {
  state.sortMode = mode;
  localStorage.setItem('sortMode', mode);
  sortHand();
  render();
}


// ══════════════════════════════════════════════
//  족보 판정
//  선택한 카드 중 "실제로 점수에 들어가는 카드"까지 같이 돌려준다.
//  (예: 원페어면 짝 맞은 2장만 칩을 준다)
// ══════════════════════════════════════════════

// 족보의 실제 칩/배수 = 기본값 + 이번 런에서 얻은 보너스.
// HAND_TYPES 원본은 절대 건드리지 않는다 (런이 끝나도 남아버린다).
function statsFor(type) {
  const def = HAND_TYPES[type];
  const b   = (state && state.bonus && state.bonus[type]) || { chips: 0, mult: 0 };
  return { chips: def.chips + b.chips, mult: def.mult + b.mult };
}

function evaluate(cards) {
  if (cards.length === 0) return null;

  // 랭크별로 묶기
  const byRank = new Map();
  for (const c of cards) {
    if (!byRank.has(c.rank)) byRank.set(c.rank, []);
    byRank.get(c.rank).push(c);
  }
  // 많이 겹친 순 → 랭크 높은 순
  const groups = [...byRank.values()].sort((a, b) => b.length - a.length || b[0].rank - a[0].rank);
  const sizes = groups.map(g => g.length);

  const isFive  = cards.length === 5;
  const isFlush = isFive && cards.every(c => c.suit === cards[0].suit);

  let isStraight = false;
  if (isFive && sizes[0] === 1) {
    const r = cards.map(c => c.rank).sort((a, b) => a - b);
    // 일반 스트레이트
    if (r[4] - r[0] === 4) isStraight = true;
    // 10-J-Q-K-A (A를 1로 저장했기 때문에 따로 처리)
    if (r[0] === 1 && r[1] === 10 && r[4] === 13) isStraight = true;
  }

  let type, scoring;
  if (isStraight && isFlush)  { type = 'straightFlush'; scoring = cards; }
  else if (sizes[0] === 4)    { type = 'fourKind';      scoring = groups[0]; }
  else if (sizes[0] === 3 && sizes[1] === 2) { type = 'fullHouse'; scoring = cards; }
  else if (isFlush)           { type = 'flush';         scoring = cards; }
  else if (isStraight)        { type = 'straight';      scoring = cards; }
  else if (sizes[0] === 3)    { type = 'threeKind';     scoring = groups[0]; }
  else if (sizes[0] === 2 && sizes[1] === 2) { type = 'twoPair'; scoring = [...groups[0], ...groups[1]]; }
  else if (sizes[0] === 2)    { type = 'pair';          scoring = groups[0]; }
  else {
    type = 'highCard';
    // 가장 높은 카드 한 장만 (A가 제일 높음)
    const best = cards.reduce((a, b) => (b.rank === 1 ? 14 : b.rank) > (a.rank === 1 ? 14 : a.rank) ? b : a);
    scoring = [best];
  }

  const def   = HAND_TYPES[type];
  const b     = statsFor(type);
  const chips = b.chips + scoring.reduce((sum, c) => sum + chipsOf(c.rank), 0);

  return { type, name: L(def.name), chips, mult: b.mult, score: chips * b.mult };
}


// ══════════════════════════════════════════════
//  족보표 — 손패로 지금 뭘 만들 수 있는지 켜서 보여준다.
//  포커를 몰라도 목록만 보고 규칙을 알 수 있어야 한다.
// ══════════════════════════════════════════════

// 랭크 집합 안에 5장 연속이 있는가 (A는 맨 앞과 맨 뒤 모두 가능)
function hasStraight(ranks) {
  for (let start = 1; start <= 9; start++) {
    let ok = true;
    for (let k = 0; k < 5; k++) if (!ranks.has(start + k)) { ok = false; break; }
    if (ok) return true;
  }
  return [10, 11, 12, 13, 1].every(r => ranks.has(r));   // 10-J-Q-K-A
}

function availableTypes() {
  const rankCount = {}, suitCount = {}, ranksBySuit = {};
  for (const c of state.hand) {
    rankCount[c.rank] = (rankCount[c.rank] || 0) + 1;
    suitCount[c.suit] = (suitCount[c.suit] || 0) + 1;
    (ranksBySuit[c.suit] = ranksBySuit[c.suit] || new Set()).add(c.rank);
  }
  const counts = Object.values(rankCount).sort((a, b) => b - a);
  const pairs  = counts.filter(n => n >= 2).length;
  const ranks  = new Set(state.hand.map(c => c.rank));

  const can = new Set();
  if (counts[0] >= 2)               can.add('pair');
  if (pairs >= 2)                   can.add('twoPair');
  if (counts[0] >= 3)               can.add('threeKind');
  if (counts[0] >= 4)               can.add('fourKind');
  if (counts[0] >= 3 && pairs >= 2) can.add('fullHouse');
  if (hasStraight(ranks))           can.add('straight');
  if (Object.values(suitCount).some(n => n >= 5)) can.add('flush');
  for (const s in ranksBySuit) if (hasStraight(ranksBySuit[s])) can.add('straightFlush');
  return can;
}

function renderGuide() {
  const can = availableTypes();
  $('guide-summary').innerHTML = can.size ? t('guide_count', can.size) : t('guide');

  $('guide-list').innerHTML = GUIDE_ORDER.map(key => {
    const def = HAND_TYPES[key];
    const s   = statsFor(key);                     // 업그레이드가 반영된 실제 수치
    const up  = s.mult > def.mult || s.chips > def.chips;
    return `<div class="guide-row${can.has(key) ? ' can' : ''}">`
         +   `<span><span class="guide-name">${L(def.name)}</span>`
         +   `<span class="guide-desc">${L(def.desc)}</span></span>`
         +   `<span class="guide-score${up ? ' buffed' : ''}">${s.chips} × ${s.mult}</span>`
         + '</div>';
  }).join('');
}


// 이 핸드를 지금 내면 연쇄가 몇 배가 되는가.
// 직전 핸드보다 칩이 높아야 이어진다. 족보 종류는 상관없다.
// → 같은 족보를 반복하는 것만으로는 오래 못 가고,
//   "낮은 패를 먼저 쓰고 센 패를 아껴두는" 판단이 생긴다.
function comboFor(chips) {
  const 이김 = state.chainEqual ? chips >= state.lastChips : chips > state.lastChips;
  if (이김) return Math.min(state.combo + 1, state.comboCap);

  // 끊겼을 때 어디까지 떨어지는가 (업그레이드로 완화할 수 있다)
  const 바닥 = state.comboFloor;
  return state.chainSoft ? Math.max(바닥, Math.floor(state.combo / 2)) : 바닥;
}

// 연쇄가 일정 단계를 넘으면 배수가 2배가 되는 업그레이드가 있다.
// 미리보기와 실제 계산이 같은 값을 쓰도록 한 곳에 모은다.
function effectiveMult(baseMult, combo) {
  return state.surgeAt && combo >= state.surgeAt ? baseMult * 2 : baseMult;
}


// ══════════════════════════════════════════════
//  플레이어 액션
// ══════════════════════════════════════════════

function toggleCard(index) {
  if (state.locked) return;
  if (state.selected.has(index)) {
    state.selected.delete(index);
    sfx.deselect();
  } else {
    if (state.selected.size >= 5) return;   // 최대 5장
    state.selected.add(index);
    sfx.select();
  }
  render();
}

function selectedCards() {
  return [...state.selected].map(i => state.hand[i]);
}

// 선택한 카드를 손에서 빼고 다시 채운다
function removeSelected() {
  const keep = state.hand.filter((_, i) => !state.selected.has(i));
  state.hand = keep;
  state.selected.clear();
  drawUp();
}

function play() {
  if (state.locked || state.selected.size === 0) return;
  const result = evaluate(selectedCards());
  const prevCombo = state.combo;

  // 연쇄 갱신 → 점수에 곱한다
  state.combo = comboFor(result.chips);
  const 끊김 = state.combo < prevCombo;

  // 쌓이면 계단으로 올라가는 소리, 끊기면 떨어지는 소리
  if (끊김) sfx.chainBreak();
  sfx.score(state.combo);
  state.maxCombo = Math.max(state.maxCombo, state.combo);
  state.lastChips = result.chips;
  state.lastName  = result.name;
  result.combo = state.combo;
  result.mult  = effectiveMult(result.mult, state.combo);
  result.score = (state.zeroOnBreak && 끊김)
    ? 0
    : result.chips * result.mult * result.combo;

  state.locked = true;
  state.handsLeft--;
  state.stageScore += result.score;
  state.totalScore += result.score;

  removeSelected();
  render();
  showScorePop(result);

  // 연출이 끝난 뒤 승패 판정
  setTimeout(() => {
    state.locked = false;
    if (state.stageScore >= targetFor(state.stage)) {
      stageClear();
    } else if (state.handsLeft <= 0) {
      gameOver();
    } else {
      render();
    }
  }, 900);
}

function discard() {
  if (state.locked || state.selected.size === 0 || state.discardsLeft <= 0) return;
  state.discardsLeft--;
  sfx.discard();
  removeSelected();
  render();
}


// ══════════════════════════════════════════════
//  화면 그리기
// ══════════════════════════════════════════════

const $ = id => document.getElementById(id);

function render() {
  const target = targetFor(state.stage);

  $('hud-stage').textContent  = state.stage;
  $('hud-target').textContent = target.toLocaleString();
  $('hud-score').textContent  = state.stageScore.toLocaleString();
  $('hud-left').textContent   = `${state.handsLeft} / ${state.discardsLeft}`;
  $('progress').style.width   = Math.min(100, state.stageScore / target * 100) + '%';

  // 손패
  const handEl = $('hand');
  handEl.innerHTML = '';
  state.hand.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'card'
      + (state.selected.has(i) ? ' selected' : '')
      + (card.suit === 1 || card.suit === 2 ? ' red' : '');
    el.innerHTML = `<div class="card-rank">${RANK_NAMES[card.rank]}</div>`
                 + `<div class="card-suit">${SUITS[card.suit]}</div>`;
    el.onclick = () => toggleCard(i);
    handEl.appendChild(el);
  });

  // 선택한 조합 미리보기 (연출 중에는 건드리지 않는다)
  if (!state.locked) {
    const preview = state.selected.size > 0 ? evaluate(selectedCards()) : null;
    if (preview) {
      $('hand-name').textContent = preview.name;
      $('hand-name').classList.add('active');
      $('chips').textContent = preview.chips;
      const c = comboFor(preview.chips);
      $('mult').textContent  = effectiveMult(preview.mult, c);
      setCombo(c, false);
    } else {
      $('hand-name').textContent = t('pick_cards');
      $('hand-name').classList.remove('active');
      $('chips').textContent = '0';
      $('mult').textContent  = '0';
      // 아무것도 안 골랐을 때는 "지금 살아있는 연쇄"를 보여준다.
      // 1로 되돌리면 방금 쌓은 게 사라진 것처럼 보인다.
      setCombo(Math.max(state.combo, 1), false);
    }
    renderChain(preview);
    renderProjection(preview);
  }

  renderGuide();

  $('sort-rank').classList.toggle('active', state.sortMode !== 'suit');
  $('sort-suit').classList.toggle('active', state.sortMode === 'suit');

  $('btn-play').disabled    = state.locked || state.selected.size === 0;
  $('btn-discard').disabled = state.locked || state.selected.size === 0 || state.discardsLeft <= 0;
}

// 연쇄 숫자는 1일 때 꺼져 있다가 쌓이는 순간 켜지면서 튄다.
// 이 "켜지는 순간"이 설명 없이 메커닉을 알려주는 지점이다.
function setCombo(value, bump) {
  const el = $('combo');
  el.textContent = value;
  el.classList.toggle('idle', value <= 1);
  el.classList.remove('bump');
  if (bump && value > 1) {
    void el.offsetWidth;          // 애니메이션 재시작
    el.classList.add('bump');
  }
}

// 지금 이 족보를 내면 연쇄가 어떻게 되는지 한 줄로 알려준다.
// 이게 없으면 "이어갈까 갈아탈까"를 판단할 근거가 없다.
function renderChain(preview) {
  const el = $('chain');
  el.className = 'chain';

  // 칩 기준이 비어 있는 상태 (판 시작 또는 새 스테이지)
  if (!state.lastName) {
    if (state.combo > 1) {
      // 연쇄를 들고 새 스테이지에 왔다. 아무 패로나 이어갈 수 있다는 걸 알려준다.
      el.classList.add('keep');
      el.textContent = t('chain_carry', state.combo);
    } else {
      el.textContent = preview ? t('chain_first') : t('chain_intro');
    }
    return;
  }

  const need = state.lastChips;   // 이 칩을 넘겨야 이어진다

  if (!preview) {
    el.textContent = t('chain_last', state.lastName, need, state.combo);
  } else if (preview.chips > need) {
    const next = comboFor(preview.chips);
    el.classList.add('keep');
    el.textContent = next >= state.comboCap
      ? t('chain_max', state.comboCap)
      : t('chain_hold', preview.chips, need, next);
  } else {
    el.classList.add('break');
    el.textContent = state.combo > 1
      ? t('chain_break', preview.chips, need, state.combo)
      : t('chain_none', preview.chips, need);
  }
}

// 고른 패를 내면 몇 점이고, 그걸 더하면 스테이지를 넘는지 보여준다.
// 곱셈 암산은 잡일이지 판단이 아니므로 대신 해준다.
function renderProjection(preview) {
  const res = $('result');
  const prj = $('projection');

  if (!preview) {
    res.className = 'result';
    res.textContent = '';
    prj.className = 'projection';
    prj.textContent = '';
    return;
  }

  const c      = comboFor(preview.chips);
  const gain   = (state.zeroOnBreak && c < state.combo)
    ? 0
    : preview.chips * effectiveMult(preview.mult, c) * c;
  const after  = state.stageScore + gain;
  const target = targetFor(state.stage);
  const 클리어 = after >= target;

  res.className = 'result preview';
  res.textContent = '= ' + gain.toLocaleString();

  prj.className = 'projection' + (클리어 ? ' clear' : '');
  prj.textContent = `${after.toLocaleString()} / ${target.toLocaleString()}`
                  + (클리어 ? t('clear_mark') : '');
}

// 점수가 터지는 연출
function showScorePop(result) {
  $('hand-name').textContent = result.name;
  $('hand-name').classList.add('active');
  $('chips').textContent = result.chips;
  $('mult').textContent  = result.mult;
  setCombo(result.combo, true);
  renderChain(null);

  $('projection').className = 'projection';
  $('projection').textContent = '';

  const el = $('result');
  el.className = 'result';          // 예상치(preview) 스타일을 확실히 걷어낸다
  el.textContent = '+' + result.score.toLocaleString();
  void el.offsetWidth;              // 애니메이션 재시작 트릭
  el.classList.add('pop');
}


// ══════════════════════════════════════════════
//  스테이지 클리어 / 게임 오버
// ══════════════════════════════════════════════

function bestScore() {
  return Number(localStorage.getItem('best') || 0);
}

// 아직 최대 획득 횟수에 안 걸린 것들 중에서 n개를 뽑는다
function pickUpgrades(n) {
  const pool = UPGRADES.filter(u =>
    (state.taken[u.id] || 0) < (u.max || Infinity) &&
    (!u.ok || u.ok(state))          // 지금 상태에서 말이 안 되는 건 후보에서 뺀다
  );
  return shuffle([...pool]).slice(0, n);
}

function renderUpgrades(list) {
  const box = $('ov-upgrades');
  box.innerHTML = '';

  for (const u of list) {
    const el = document.createElement('button');
    el.className = 'upgrade';
    el.innerHTML = `<span class="upgrade-name">${L(u.name)}</span>`
                 + `<span class="upgrade-desc">${L(u.desc)}</span>`;
    el.onclick = () => {
      sfx.upgrade();
      u.apply(state);
      state.taken[u.id] = (state.taken[u.id] || 0) + 1;
      track('upgrade-' + u.id);
      $('overlay').classList.add('hidden');
      state.stage++;
      startStage();
    };
    box.appendChild(el);
  }
}

function stageClear() {
  // 남은 핸드를 점수로 바꿔주는 업그레이드
  const bank = state.handsLeft * state.bankPerHand;
  if (bank > 0) { state.stageScore += bank; state.totalScore += bank; }

  track('stage-clear-' + state.stage);
  sfx.clear();
  showOverlay(
    t('stage_clear', state.stage),
    state.stageScore.toLocaleString(),
    t('pick_one', targetFor(state.stage + 1).toLocaleString()),
    null, null, false,
    pickUpgrades(3)
  );
}

function gameOver() {
  const best = bestScore();
  const isNewBest = state.totalScore > best;
  if (isNewBest) localStorage.setItem('best', state.totalScore);

  sfx.over();
  track('gameover-stage-' + state.stage);
  track('maxcombo-' + state.maxCombo);
  track(playtimeBucket((Date.now() - state.startedAt) / 1000));

  showOverlay(
    t('game_over'),
    state.totalScore.toLocaleString(),
    isNewBest
      ? t('new_best', best.toLocaleString())
      : t('ended_at', state.stage, best.toLocaleString()),
    t('play_again'),
    newGame,
    true          // 게임오버에서만 공유 UI를 띄운다
  );
}

// 붙여넣기 좋은 한 판 요약. 초록/빨강 칸이 이번 판의 궤적이다.
function shareText() {
  const cleared = Math.max(0, state.stage - 1);
  return [
    t('share_title'),
    t('share_line1', state.stage, state.totalScore.toLocaleString()),
    t('share_line2', state.maxCombo),
    '🟩'.repeat(cleared) + '🟥',
    SHARE_URL,
  ].join('\n');
}

async function copyShare() {
  const btn = $('ov-share-btn');
  const text = shareText();
  let ok = true;

  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // 클립보드 권한이 막힌 환경 대비
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    } catch { ok = false; }
  }

  if (ok) track('share-copy');
  btn.textContent = ok ? t('copied') : t('copy_manual');
  setTimeout(() => { btn.textContent = t('copy_result'); }, 1800);
}

function showOverlay(title, score, desc, btnText, onClick, share, upgrades) {
  $('ov-title').textContent = title;
  $('ov-score').textContent = score;
  $('ov-desc').textContent  = desc;

  // 업그레이드를 고르는 화면에서는 버튼 대신 카드가 선택지가 된다
  $('ov-upgrades').classList.toggle('hidden', !upgrades);
  $('ov-btn').classList.toggle('hidden', !!upgrades);
  if (upgrades) renderUpgrades(upgrades);

  if (onClick) {
    $('ov-btn').textContent = btnText;
    $('ov-btn').onclick = () => { $('overlay').classList.add('hidden'); onClick(); };
  }

  // 공유는 판이 끝났을 때만. 스테이지 중간엔 아직 자랑할 게 아니다.
  $('ov-share').classList.toggle('hidden', !share);
  $('ov-share-btn').classList.toggle('hidden', !share);
  if (share) {
    $('ov-share').textContent     = shareText();
    $('ov-share-btn').textContent = t('copy_result');
    $('ov-share-btn').onclick     = copyShare;
  }

  $('overlay').classList.remove('hidden');
}


// ══════════════════════════════════════════════

// data-i18n이 붙은 정적 요소를 현재 언어로 갈아끼운다
function applyStaticText() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.title = t('title');
  document.documentElement.lang = LANG;
  $('lang-en').classList.toggle('active', LANG === 'en');
  $('lang-ko').classList.toggle('active', LANG === 'ko');
}

function setLang(lang) {
  LANG = lang;
  localStorage.setItem('lang', lang);
  applyStaticText();
  render();                       // 족보표·안내문 등 동적 문자열까지 다시 그린다
}

$('btn-play').onclick    = play;
$('btn-discard').onclick = discard;
$('sort-rank').onclick   = () => setSort('rank');
$('sort-suit').onclick   = () => setSort('suit');
$('lang-en').onclick     = () => setLang('en');
$('lang-ko').onclick     = () => setLang('ko');

function setSound(on) {
  SOUND_ON = on;
  localStorage.setItem('sound', on ? 'on' : 'off');
  $('sound-btn').textContent = on ? '🔊' : '🔇';
  $('sound-btn').classList.toggle('active', on);
  if (on) sfx.select();          // 켠 순간 들려줘야 켜진 걸 안다
}
$('sound-btn').onclick = () => setSound(!SOUND_ON);

// 저장된 설정을 화면에 반영 (여기선 소리를 내지 않는다)
$('sound-btn').textContent = SOUND_ON ? '🔊' : '🔇';
$('sound-btn').classList.toggle('active', SOUND_ON);

applyStaticText();
newGame();
</script>
