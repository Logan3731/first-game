# Cloudflare Worker 배포 설정
#
# 대시보드의 Bindings 화면에서 KV 목록이 안 뜨는 문제를 우회한다.
# 목록에서 고르는 대신 네임스페이스 ID를 직접 적는다.
#
# 배포:
#   cd worker
#   npx wrangler login     ← 브라우저가 열리고 승인하면 끝 (한 번만)
#   npx wrangler deploy

name = "chain-leaderboard"
main = "leaderboard.js"
compatibility_date = "2026-08-10"

# Workers KV — chain-scores
# 코드에서 env.SCORES 로 접근한다
[[kv_namespaces]]
binding = "SCORES"
id = "67d954a3361d46fcadeaa48a1c2572d9"

# 순위표 본체. 순위표 하나당 인스턴스 하나라 요청이 한 줄로 선다.
# KV만 쓰면 동시에 들어온 점수가 서로를 덮어써서 사라진다.
# 도배 횟수도 여기서 센다 (ratelimits 바인딩은 실제로 안 막혔다 — 12연속 통과).
[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]

# 순위표를 5분마다 깨워둔다. 식은 Durable Object의 첫 호출이 실패하는데,
# 플레이어가 적어서 사람이 오는 시점엔 거의 항상 식어 있다.
[triggers]
crons = ["*/5 * * * *"]
